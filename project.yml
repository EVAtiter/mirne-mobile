name: mirne-mobile

# 署名チームと証明書名はここに書かない。
# Config/Base.xcconfig が既定（アドホック署名）を決め、手元の Config/Local.xcconfig で上書きする。

options:
  bundleIdPrefix: com.slack-kingdom
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "27"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # arm64 専用ビルド（共通ルールの方針）
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # 版とビルド番号はここだけに書く（Info.plist は $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) で参照する）
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "13"
  configs:
    # xcodegen は #if DEBUG 用の DEBUG を自動定義しないので明示する
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    # build アクションの Release でもシンボルを削る（archive は既定で削る）。
    # 削らないと、デバッグ用のシンボル情報に手元のパス（ユーザー名を含む）が残る
    Release:
      DEPLOYMENT_POSTPROCESSING: YES

# アプリ・計測用のコマンド・単体試験が共通で取り込むソース。
# NasneKit（nasne との通信）と DTCPKit（DTCP-IP）は中身ができるまで無いので optional にしてある
targetTemplates:
  CoreSources:
    sources:
      - path: Sources/NasneKit
        optional: true
      - path: Sources/DTCPKit
        optional: true
      - path: Sources/TSPipeline
      - path: Sources/SI
      - path: Sources/Player
        # OS ごとに分かれるファイルは、ターゲットごとに取り込む（PlayerMacOS・PlayerIOS）
        excludes:
          - "macOS/**"
          - "iOS/**"
      # 画面に出す形への変換（誤りの文言など）。AppKit・SwiftUI に依存させない
      - path: Sources/Presentation
      # 録画の再生（DTCPKit と再生系をつなぐ。AppKit に依存させない）
      - path: Sources/Playback

  # 画面の層のうち macOS と iPad で共有するもの（組み立て・字幕の重ね出しなど）。OS ごとの部分は UIMacOS・UIIOS
  UIShared:
    sources:
      - path: Sources/UI
        excludes:
          - "macOS/**"
          - "iOS/**"
  UIMacOS:
    sources:
      - path: Sources/UI/macOS
  UIIOS:
    sources:
      - path: Sources/UI/iOS

  # Player の中の OS ごとのファイル（映像を出すビューなど）
  PlayerMacOS:
    sources:
      - path: Sources/Player/macOS
  PlayerIOS:
    sources:
      - path: Sources/Player/iOS
    # MPEG-2 は FFmpeg（mpeg2video だけ・LGPL-2.1）で復号する。組む前なら、ビルドの前に scripts/build-ffmpeg-ios.sh が
    # ffmpeg.org から版を固定して取り、build/ffmpeg に組む（git には入れない）。動的なフレームワークで同梱する
    preBuildScripts:
      - name: FFmpeg を組む（組む前・設定が変わったときだけ）
        script: |
          "${SRCROOT}/scripts/build-ffmpeg-ios.sh" --if-missing
        basedOnDependencyAnalysis: false
    # 同梱はビルドの後の段で写して署名する（xcframework として登録すると、組む前の状態からビルドできない）
    postBuildScripts:
      - name: FFmpeg のフレームワークを同梱する
        script: |
          "${SRCROOT}/scripts/embed-ffmpeg-ios.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        # 組む段はネットワークと build/ への書き込みが要る
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CFFmpegMPEG2
        OTHER_SWIFT_FLAGS: -Xcc -I$(SRCROOT)/build/ffmpeg/include
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/build/ffmpeg/frameworks/iphoneos
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/build/ffmpeg/frameworks/iphonesimulator
        OTHER_LDFLAGS: $(inherited) -framework avcodec -framework avutil

targets:
  mirne-mobile:
    type: application
    platform: macOS
    templates:
      - CoreSources
      - PlayerMacOS
      - UIShared
      - UIMacOS
    sources:
      - path: Sources/App
        excludes:
          - "**/.DS_Store"
          # Info.plist は INFOPLIST_FILE で参照するのでリソースコピーから外す
          - "Info.plist"
      # 設定の「このアプリについて」で読む NOTICE（受け継いだソースの一覧と許諾）
      - path: NOTICE
        buildPhase: resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # Finder に出る名前（mirne mobile.app）。モジュール名は mirne_mobile になる
        PRODUCT_NAME: mirne mobile
        PRODUCT_BUNDLE_IDENTIFIER: com.slack-kingdom.mirne-mobile
        INFOPLIST_FILE: Sources/App/Info.plist
        # アプリアイコン（Sources/App/Assets.xcassets。scripts/make-icon.sh で作る。macOS 27 は icns だけだと小さい表示を灰色の箱に入れる）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TTL を設定した生のソケット（DTCP-IP の AKE）とローカルネットワークのため App Sandbox は使わない
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SKIP_INSTALL: NO

  # 計測用のコマンド。配布物には含めない
  mirne-mobile-probe:
    type: tool
    platform: macOS
    templates:
      - CoreSources
      - PlayerMacOS
    sources:
      - path: Sources/Probe
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: mirne-mobile-probe
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # 単体試験。アプリには載せず、試験するソースを直接取り込む
  mirneMobileTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - CoreSources
      - PlayerMacOS
    sources:
      - path: Tests/mirneMobileTests
        excludes:
          - "Info.plist"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: mirneMobileTests
        PRODUCT_BUNDLE_IDENTIFIER: com.slack-kingdom.mirneMobileTests
        INFOPLIST_FILE: Tests/mirneMobileTests/Info.plist

  # iPad 版（iOS / iPadOS）。共有の部品はそのまま取り込み、画面は Sources/iOSApp に置く
  mirne-mobile-iOS:
    type: application
    platform: iOS
    templates:
      - CoreSources
      - PlayerIOS
      - UIShared
      - UIIOS
    sources:
      # 画面・Info.plist・アイコン（Assets.xcassets。scripts/make-icon.sh ios で作る）・FFmpeg の LGPL-2.1 の全文（Licenses）
      - path: Sources/iOSApp
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
      # 配る IPA に NOTICE（同梱した部品と FFmpeg のソースの在りか）を入れる
      - path: NOTICE
        buildPhase: resources
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_NAME: mirne mobile
        # アイコン（iOS は Asset Catalog だけが経路。1024px の 1 枚）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # macOS 版と同じ Bundle ID（OS が違えば同じでよい）
        PRODUCT_BUNDLE_IDENTIFIER: com.slack-kingdom.mirne-mobile
        INFOPLIST_FILE: Sources/iOSApp/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # iPhone と iPad（1.1.0 までは iPad だけ。2026-11-23 に iPhone も対象にした）
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO

  # 共有の部品の単体試験を iOS のシミュレータで流す（試験の中身は macOS と同じ）
  mirneMobileTests-iOS:
    type: bundle.unit-test
    platform: iOS
    templates:
      - CoreSources
      - PlayerIOS
    sources:
      - path: Tests/mirneMobileTests
        excludes:
          - "Info.plist"
      # iOS だけの試験（FFmpeg の復号など）
      - path: Tests/iOS
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_NAME: mirneMobileTests
        PRODUCT_BUNDLE_IDENTIFIER: com.slack-kingdom.mirneMobileTests
        GENERATE_INFOPLIST_FILE: YES
        # 試験のバンドルの中に同梱した FFmpeg のフレームワークを見つける
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/Frameworks"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  mirne-mobile:
    build:
      targets:
        mirne-mobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - mirneMobileTests
    archive:
      config: Release
  mirne-mobile-probe:
    build:
      targets:
        mirne-mobile-probe: all
    run:
      config: Debug
  mirne-mobile-iOS:
    build:
      targets:
        mirne-mobile-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - mirneMobileTests-iOS
    archive:
      config: Release
